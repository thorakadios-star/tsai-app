<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TSAI · TrueStats AI — Preview</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',system-ui,sans-serif}
.chrome{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px}
.label{color:rgba(255,255,255,0.3);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.phone{width:390px;height:844px;background:#060A18;border-radius:50px;overflow:hidden;position:relative;
  box-shadow:0 50px 100px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.07),inset 0 0 0 2px rgba(255,255,255,0.03)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:999;pointer-events:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;background:rgba(255,255,255,0.22);border-radius:3px;z-index:999;pointer-events:none}

::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div class="chrome">
  <div class="label">TSAI · TrueStats AI · v0.7</div>
  <div class="phone">
    <div class="island"></div>
    <div class="homebar"></div>
    <div id="root"></div>
  </div>
</div>

<script type="text/babel">
const {useState,useContext,createContext,useRef,useEffect} = React;

// ── Tokens ────────────────────────────────────────────────────────────────────
const C={
  accent:'#5EEAD4',accentInk:'#04111C',accent2:'#A855F7',accent3:'#3B82F6',accent4:'#34D399',
  positive:'#34D399',negative:'#F87171',gold:'#FBBF24',
  bg0:'#060A18',bg1:'#0B1024',bg2:'#11183A',bg3:'#1A2350',
  border:'rgba(120,170,255,0.10)',borderStrong:'rgba(120,170,255,0.20)',
  ink0:'#EAF2FF',ink1:'rgba(234,242,255,0.70)',ink2:'rgba(234,242,255,0.45)',ink3:'rgba(234,242,255,0.22)',
};

// ── Nav ───────────────────────────────────────────────────────────────────────
const NavCtx = createContext(null);
function NavProvider({children}){
  const [stack,setStack]=useState([{s:'splash',p:{}}]);
  const push =(s,p={})=>setStack(prev=>[...prev,{s,p}]);
  const pop  =()=>setStack(prev=>prev.length>1?prev.slice(0,-1):prev);
  const reset=(s,p={})=>setStack([{s,p}]);
  const cur=stack[stack.length-1];
  return <NavCtx.Provider value={{cur,push,pop,reset,canBack:stack.length>1}}>{children}</NavCtx.Provider>;
}
const useNav=()=>useContext(NavCtx);

// ── Auth ──────────────────────────────────────────────────────────────────────
const AuthCtx=createContext(null);
function AuthProvider({children}){
  const [session,setSession]=useState(null);
  return <AuthCtx.Provider value={{session,setSession}}>{children}</AuthCtx.Provider>;
}
const useAuth=()=>useContext(AuthCtx);

// ── Atoms ─────────────────────────────────────────────────────────────────────
function Avatar({name='?',size=40}){
  const s=(name||'?').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const bg=['#7a3030','#7a5a30','#307a5a','#305a7a','#5a307a','#7a3060'][s%6];
  const ini=(name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return <div style={{width:size,height:size,borderRadius:size/2,background:bg,display:'flex',
    alignItems:'center',justifyContent:'center',flexShrink:0,fontWeight:700,
    fontSize:Math.round(size*.38),color:'#fff'}}>{ini}</div>;
}
function Kicker({c,children}){return <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:1.4,textTransform:'uppercase',color:c||C.ink2}}>{children}</span>;}
function Mono({children,style={}}){return <span style={{fontFamily:"'JetBrains Mono',monospace",...style}}>{children}</span>;}
function Display({children,style={}}){return <span style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:700,textTransform:'uppercase',letterSpacing:-.5,color:C.ink0,...style}}>{children}</span>;}
function Card({children,style={}}){return <div style={{background:C.bg1,borderRadius:14,border:`1px solid ${C.border}`,...style}}>{children}</div>;}
function Chip({label,active,onClick}){
  return <button onClick={onClick} style={{flexShrink:0,padding:'6px 12px',borderRadius:999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:1,background:active?C.accent:'transparent',color:active?C.accentInk:C.ink1,border:`1px solid ${active?C.accent:C.borderStrong}`,fontWeight:active?700:500,cursor:'pointer',whiteSpace:'nowrap'}}>{label}</button>;
}
function BtnPrimary({children,onClick,style={}}){
  return <button onClick={onClick} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,height:46,padding:'0 18px',width:'100%',background:C.accent,color:C.accentInk,border:'none',borderRadius:999,fontWeight:700,fontSize:13,letterSpacing:.5,cursor:'pointer',...style}}>{children}</button>;
}
function BtnGhost({children,onClick,style={}}){
  return <button onClick={onClick} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,height:46,padding:'0 16px',width:'100%',background:'rgba(255,255,255,0.03)',color:C.ink0,border:`1px solid ${C.borderStrong}`,borderRadius:999,fontWeight:500,fontSize:13,cursor:'pointer',...style}}>{children}</button>;
}
function LiveBadge(){
  return <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 5px',borderRadius:4,border:'1px solid rgba(248,113,113,0.4)'}}>
    <span style={{width:4,height:4,borderRadius:2,background:C.negative,animation:'pulse 1.5s infinite'}}/>
    <Mono style={{fontSize:8,color:C.negative,fontWeight:700,letterSpacing:1}}>LIVE</Mono>
  </span>;
}

// ── TabBar ────────────────────────────────────────────────────────────────────
const TABS=[{id:'home',label:'Canales',icon:'⊟'},{id:'ranking',label:'Ranking',icon:'◈'},{id:'market',label:'Élite',icon:'◆'},{id:'cuenta',label:'Cuenta',icon:'○'}];
function TabBar({active,onTab}){
  return <div style={{flexShrink:0,display:'grid',gridTemplateColumns:'repeat(4,1fr)',padding:'10px 8px 20px',background:C.bg0,borderTop:`1px solid ${C.border}`}}>
    {TABS.map(t=><button key={t.id} onClick={()=>onTab(t.id)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'5px 0',background:'none',border:'none',cursor:'pointer'}}>
      <span style={{fontSize:16,color:active===t.id?C.accent:C.ink3}}>{t.icon}</span>
      <Mono style={{fontSize:9,letterSpacing:1,textTransform:'uppercase',color:active===t.id?C.accent:C.ink2}}>{t.label}</Mono>
    </button>)}
  </div>;
}

// ── Pill ──────────────────────────────────────────────────────────────────────
function Pill({children}){
  return <div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'5px 12px',borderRadius:999,border:'1px solid rgba(94,234,212,0.4)',background:'rgba(94,234,212,0.04)'}}>
    <div style={{width:5,height:5,borderRadius:3,background:C.accent}}/>
    <Kicker>{children}</Kicker>
  </div>;
}

// ── NavHeader ─────────────────────────────────────────────────────────────────
function NavHeader({title,right,showBack=true}){
  const {pop,canBack}=useNav();
  return <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'52px 14px 12px',background:C.bg0,borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
    {showBack&&canBack
      ?<button onClick={pop} style={{width:34,height:34,borderRadius:17,background:C.bg2,border:`1px solid ${C.border}`,color:C.ink0,fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>
      :<div style={{width:34}}/>}
    <Display style={{fontSize:16}}>{title}</Display>
    {right??<div style={{width:34}}/>}
  </div>;
}

// ── SPLASH ────────────────────────────────────────────────────────────────────
function SplashScreen(){
  const {push}=useNav();
  const {setSession}=useAuth();
  const login=()=>setSession({user:{id:'mock',email:'user@tsai.app'}});
  return <div style={{height:'100%',background:C.bg0,display:'flex',flexDirection:'column',padding:'80px 28px 40px',gap:0,overflow:'auto'}}>
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:20}}>
      <Pill>PRONÓSTICOS · DATOS REALES · VERIFICADO</Pill>
      <div style={{width:80,height:80,borderRadius:40,background:'rgba(94,234,212,0.12)',border:'1px solid rgba(94,234,212,0.3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <Display style={{fontSize:24,color:C.accent}}>TS</Display>
      </div>
      <div style={{textAlign:'center'}}>
        <Display style={{fontSize:44,lineHeight:.95,display:'block'}}>TRUE <span style={{color:C.accent}}>STATS</span></Display>
        <Display style={{fontSize:18,color:C.ink1,fontWeight:500,letterSpacing:4,display:'block',marginTop:6}}>AI</Display>
      </div>
      <p style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,textTransform:'uppercase',letterSpacing:1.5,color:C.ink1,textAlign:'center'}}>
        La <span style={{color:C.accent}}>verdad</span> detrás de cada <span style={{color:C.accent}}>pick</span>
      </p>
      <div style={{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center'}}>
        {['✓ Verificado','⏱ Timestamp','🛡 Inmutable','⚡ Auditado'].map(l=>
          <div key={l} style={{padding:'8px 12px',borderRadius:999,border:`1px solid ${C.border}`,background:'rgba(94,234,212,0.04)'}}>
            <Mono style={{fontSize:10,color:C.ink1,letterSpacing:1,textTransform:'uppercase'}}>{l}</Mono>
          </div>
        )}
      </div>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <BtnPrimary onClick={login}>COMENZAR — ES GRATIS</BtnPrimary>
      <button onClick={()=>push('login')} style={{background:'none',border:'none',cursor:'pointer',padding:8}}>
        <p style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,textTransform:'uppercase',letterSpacing:1,color:C.ink1,textAlign:'center'}}>
          Ya tengo cuenta · <span style={{color:C.accent}}>Iniciar sesión</span>
        </p>
      </button>
    </div>
  </div>;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function LoginScreen(){
  const {pop}=useNav();
  const {setSession}=useAuth();
  return <div style={{height:'100%',background:C.bg0,display:'flex',flexDirection:'column'}}>
    <NavHeader title="INICIAR SESIÓN"/>
    <div style={{flex:1,padding:24,display:'flex',flexDirection:'column',justifyContent:'center',gap:16}}>
      {[{l:'EMAIL',ph:'tu@email.com'},{l:'CONTRASEÑA',ph:'••••••••'}].map(f=>
        <div key={f.l} style={{display:'flex',flexDirection:'column',gap:6}}>
          <Kicker>{f.l}</Kicker>
          <div style={{height:44,background:C.bg2,borderRadius:10,border:`1px solid ${C.borderStrong}`,padding:'0 14px',display:'flex',alignItems:'center'}}>
            <span style={{fontSize:13,color:C.ink3}}>{f.ph}</span>
          </div>
        </div>
      )}
      <BtnPrimary onClick={()=>setSession({user:{id:'mock',email:'user@tsai.app'}})} style={{marginTop:8}}>Entrar</BtnPrimary>
      <BtnGhost onClick={pop}>Volver</BtnGhost>
    </div>
  </div>;
}

// ── HOME ──────────────────────────────────────────────────────────────────────
const CHANNELS=[
  {id:1,name:'GalloVIP',sport:'MLB · NFL',yld:'+4.33%',members:'156k',live:true,hot:true,premium:false},
  {id:2,name:'BetData',sport:'Tenis · ATP',yld:'+2.81%',members:'42k',live:false,hot:false,premium:false},
  {id:3,name:'TennisInsider',sport:'Tenis · WTA',yld:'+9.12%',members:'8.2k',live:false,hot:false,premium:true},
  {id:4,name:'Octágono',sport:'UFC · MMA',yld:'+12.4%',members:'3.4k',live:false,hot:true,premium:true},
  {id:5,name:'GreenLine',sport:'NBA',yld:'+1.92%',members:'91k',live:false,hot:false,premium:false},
];
const ECO=[
  {title:'Auditoría AI',sub:'Motor central',color:C.accent,bg:'rgba(94,234,212,0.07)',badge:'MOTOR'},
  {title:'Academia Pro',sub:'Gestión y psicología',color:C.accent2,bg:'rgba(168,85,247,0.07)'},
  {title:'Conexiones α',sub:'Networking · Real time',color:C.accent3,bg:'rgba(59,130,246,0.07)'},
  {title:'Marketplace',sub:'Pronósticos del 1%',color:C.accent4,bg:'rgba(52,211,153,0.07)'},
];
function HomeScreen({onTab}){
  const {push}=useNav();
  const [sport,setSport]=useState('Todos');

    {/* Topbar */}
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'52px 16px 12px',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:32,height:32,borderRadius:8,background:'rgba(94,234,212,0.12)',border:'1px solid rgba(94,234,212,0.3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <Display style={{fontSize:12,color:C.accent}}>TS</Display>
        </div>
        <div style={{borderLeft:`1px solid ${C.borderStrong}`,paddingLeft:10}}>
          <Kicker>TrueStats AI</Kicker>
          <div><Mono style={{fontSize:10,color:C.accent,letterSpacing:2}}>v0.7</Mono></div>
        </div>
      </div>
      <div style={{display:'flex',gap:8}}>
        {['⌕','🔔'].map(i=><div key={i} style={{width:36,height:36,borderRadius:18,background:'rgba(255,255,255,0.04)',border:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:15,color:C.ink0}}>{i}</div>)}
      </div>
    </div>
    <div style={{flex:1,overflowY:'auto'}}>
      {/* Hero */}
      <div style={{padding:'0 16px 18px'}}>
        <Card style={{background:'#0F1638',border:`1px solid ${C.borderStrong}`,padding:18}}>
          <div style={{display:'flex',justifyContent:'center',marginBottom:12}}><Pill>PRONÓSTICOS · DATOS REALES · VERIFICADO</Pill></div>
          <Display style={{fontSize:30,display:'block',textAlign:'center',marginBottom:4}}>TRUE <span style={{color:C.accent}}>STATS</span><span style={{fontSize:15,color:C.ink1,fontWeight:500}}> AI</span></Display>
          <p style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,textTransform:'uppercase',letterSpacing:1.5,color:C.ink1,textAlign:'center',marginBottom:14}}>La <span style={{color:C.accent}}>verdad</span> detrás de cada <span style={{color:C.accent}}>pick</span></p>
          <div style={{display:'flex',justifyContent:'space-between',paddingTop:12,borderTop:`1px solid ${C.border}`}}>
            {[{l:'Top yield',v:'+18.4',u:'%',hi:true},{l:'Tips audit.',v:'412'},{l:'Tipsters',v:'84'}].map(s=><div key={s.l}>
              <Kicker>{s.l}</Kicker>
              <div><Mono style={{fontSize:20,fontWeight:600,color:s.hi?C.accent:C.ink0}}>{s.v}{s.u&&<span style={{fontSize:10,color:C.ink2}}>{s.u}</span>}</Mono></div>
            </div>)}
          </div>
        </Card>
      </div>
      {/* Eco */}
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',padding:'0 16px 12px'}}>
        <Display style={{fontSize:14}}>Ecosistema</Display><Kicker>Acceso rápido</Kicker>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,padding:'0 16px 18px'}}>
        {ECO.map(e=><div key={e.title} style={{borderRadius:12,border:`1px solid ${e.color}55`,background:e.bg,padding:11,position:'relative',cursor:'pointer'}}>
          {e.badge&&<div style={{position:'absolute',top:7,right:7,border:`1px solid ${e.color}40`,borderRadius:3,padding:'2px 5px'}}><Kicker c={e.color} style={{fontSize:7}}>{e.badge}</Kicker></div>}
          <div style={{fontSize:18,color:e.color,marginBottom:8}}>◈</div>

          <div style={{fontSize:10,color:C.ink2,marginTop:3}}>{e.sub}</div>
        </div>)}
      </div>
      {/* Sport chips */}
      <div style={{display:'flex',gap:6,overflowX:'auto',padding:'0 16px 14px',scrollbarWidth:'none'}}>

          {CHANNELS.map(ch=><Card key={ch.id} style={{padding:13,display:'flex',gap:10,alignItems:'center',cursor:'pointer'}} onClick={()=>push('chat',{channel:ch})}>
            <Avatar name={ch.name} size={44}/>

              <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:2}}>

              </div>

              <div style={{display:'flex',alignItems:'center',gap:5,marginTop:5}}>
                {ch.live&&<LiveBadge/>}
                <span style={{fontSize:11,color:C.ink1}}>último tip</span>
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <Mono style={{fontSize:15,fontWeight:600,color:ch.yld.startsWith('+')?C.accent:C.negative,display:'block'}}>{ch.yld}</Mono>
              <Kicker style={{display:'block',marginTop:3}}>yield 30d</Kicker>
            </div>
          </Card>)}
        </div>
      </div>
    </div>
    <TabBar active="home" onTab={onTab}/>

}

// ── Router ────────────────────────────────────────────────────────────────────
function Router(){
  const {cur,push,reset}=useNav();
  const {session}=useAuth();
  const [tab,setTab]=useState('home');

  useEffect(()=>{
    if(!session) reset('splash');
    else reset('main');
  },[session]);

  const onTab=(id)=>{setTab(id);reset('main');};

  if(!session){
    if(cur.s==='login') return <LoginScreen/>;
    return <SplashScreen/>;
  }

  // Sub-screens (push onto stack)
  if(cur.s==='chat')   return <ChatScreen    params={cur.p} onTab={onTab}/>;
  if(cur.s==='info')   return <InfoScreen    params={cur.p} onTab={onTab}/>;
  if(cur.s==='stats')  return <StatsScreen   params={cur.p}/>;

  // Tab screens
  if(tab==='ranking') return <RankingScreen  onTab={onTab}/>;
  if(tab==='market')  return <MarketplaceScreen onTab={onTab}/>;
  if(tab==='cuenta')  return <SettingsScreen onTab={onTab}/>;
  return <HomeScreen onTab={onTab}/>;
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  return <AuthProvider><NavProvider><Router/></NavProvider></AuthProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
