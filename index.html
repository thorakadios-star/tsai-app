// ── Nav ───────────────────────────────────────────────────────────────────────
const NavCtx=createContext(null);
function NavProvider({children}){
  const [stack,setStack]=useState([{s:'splash',p:{}}]);
  const push =(s,p={})=>setStack(prev=>[...prev,{s,p}]);
  const pop  =()=>setStack(prev=>prev.length>1?prev.slice(0,-1):prev);
  const reset=(s,p={})=>setStack([{s,p}]);
  const cur=stack[stack.length-1];
  return <NavCtx.Provider value={{cur,push,pop,reset,canBack:stack.length>1}}>{children}</NavCtx.Provider>;
}
const useNav=()=>useContext(NavCtx);

// ── Auth ──────────────────────────────────────────────────────────────────────
const AuthCtx=createContext(null);
function AuthProvider({children}){
  const [session,setSession]=useState(null);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setSession(session);setLoading(false);});
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s));
    return ()=>subscription.unsubscribe();
  },[]);
  return <AuthCtx.Provider value={{session,setSession,loading}}>{children}</AuthCtx.Provider>;
}
const useAuth=()=>useContext(AuthCtx);

// ── Hooks ─────────────────────────────────────────────────────────────────────
function useTipsters(){
  const [data,setData]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  useEffect(()=>{
    sb.from('tipsters_profiles')
      .select('id,display_name,username,bio,sport_focus,is_verified,has_premium,price_monthly,total_picks,wins,losses,voids,yield_pct,win_rate_pct,profit_units,total_staked,created_at')
      .order('yield_pct',{ascending:false})
      .limit(20)
      .then(({data,error})=>{
        if(error)setError(error.message);
        else setData(data||[]);
        setLoading(false);
      });
  },[]);
  return {data,loading,error};
}

function usePicks(tipsterId){
  const [data,setData]=useState([]);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    if(!tipsterId){setLoading(false);return;}
    sb.from('boletos')
      .select('id,casa_apuestas,cuota_total,tipo_apuesta,boleto_texto,stake,estado,tipo_acceso,profit,settled_at,fecha_procesado')
      .eq('tipster_id',tipsterId)
      .order('fecha_procesado',{ascending:false})
      .limit(15)
      .then(({data,error})=>{
        if(!error)setData(data||[]);
        setLoading(false);
      });
  },[tipsterId]);
  return {data,loading};
}

function useDailyStats(tipsterId){
  const [data,setData]=useState([]);
  useEffect(()=>{
    if(!tipsterId)return;
    sb.from('tipster_daily_stats')
      .select('fecha,total_picks,profit_units,yield_pct')
      .eq('tipster_id',tipsterId)
      .order('fecha',{ascending:true})
      .limit(90)
      .then(({data})=>setData(data||[]));
  },[tipsterId]);
  return data;
}

// ── Atoms ─────────────────────────────────────────────────────────────────────
function Avatar({name='?',size=40}){
  const s=(name||'?').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const bg=['#7a3030','#7a5a30','#307a5a','#305a7a','#5a307a','#7a3060'][s%6];
  const ini=(name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return <div style={{width:size,height:size,borderRadius:size/2,background:bg,display:'flex',
    alignItems:'center',justifyContent:'center',flexShrink:0,fontWeight:700,
    fontSize:Math.round(size*.38),color:'#fff'}}>{ini}</div>;
}
function Kicker({c,style={},children}){return <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:1.4,textTransform:'uppercase',color:c||C.ink2,...style}}>{children}</span>;}
function Mono({children,style={}}){return <span style={{fontFamily:"'JetBrains Mono',monospace",...style}}>{children}</span>;}
function Display({children,style={}}){return <span style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:700,textTransform:'uppercase',letterSpacing:-.5,color:C.ink0,...style}}>{children}</span>;}
function Card({children,style={},onClick}){return <div onClick={onClick} style={{background:C.bg1,borderRadius:14,border:`1px solid ${C.border}`,...style}}>{children}</div>;}
function Chip({label,active,onClick}){return <button onClick={onClick} style={{flexShrink:0,padding:'6px 12px',borderRadius:999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:1,background:active?C.accent:'transparent',color:active?C.accentInk:C.ink1,border:`1px solid ${active?C.accent:C.borderStrong}`,fontWeight:active?700:500,cursor:'pointer',whiteSpace:'nowrap'}}>{label}</button>;}
function BtnPrimary({children,onClick,style={}}){return <button onClick={onClick} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,height:46,padding:'0 18px',width:'100%',background:C.accent,color:C.accentInk,border:'none',borderRadius:999,fontWeight:700,fontSize:13,letterSpacing:.5,cursor:'pointer',...style}}>{children}</button>;}
function BtnGhost({children,onClick,style={}}){return <button onClick={onClick} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,height:46,padding:'0 16px',width:'100%',background:'rgba(255,255,255,0.03)',color:C.ink0,border:`1px solid ${C.borderStrong}`,borderRadius:999,fontWeight:500,fontSize:13,cursor:'pointer',...style}}>{children}</button>;}
function Pill({children}){return <div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'5px 12px',borderRadius:999,border:'1px solid rgba(94,234,212,0.4)',background:'rgba(94,234,212,0.04)'}}><div style={{width:5,height:5,borderRadius:3,background:C.accent}}/><Kicker>{children}</Kicker></div>;}
function LiveBadge(){return <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 5px',borderRadius:4,border:'1px solid rgba(248,113,113,0.4)'}}><span style={{width:4,height:4,borderRadius:2,background:C.negative,animation:'pulse 1.5s infinite'}}/><Mono style={{fontSize:8,color:C.negative,fontWeight:700,letterSpacing:1}}>LIVE</Mono></span>;}

function Spinner(){return <div style={{width:20,height:20,borderRadius:10,border:`2px solid ${C.bg3}`,borderTopColor:C.accent,animation:'spin .7s linear infinite'}}/>;}

function EmptyState({icon,title,sub}){
  return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'48px 24px',gap:12}}>
    <div style={{fontSize:36,opacity:.4}}>{icon}</div>

    {sub&&<Kicker style={{textAlign:'center',textTransform:'none',letterSpacing:0,fontSize:11,color:C.ink2}}>{sub}</Kicker>}

}

function NavHeader({title,right,showBack=true}){
  const {pop,canBack}=useNav();

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function LoginScreen(){
  const {pop}=useNav();
  const {setSession}=useAuth();
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);

  const login=async()=>{
    setLoading(true);setError(null);
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){setError(error.message);setLoading(false);}
    else setSession(data.session);
  };
  return <div style={{height:'100%',background:C.bg0,display:'flex',flexDirection:'column'}}>
    <NavHeader title="INICIAR SESIÓN"/>
    <div style={{flex:1,padding:24,display:'flex',flexDirection:'column',justifyContent:'center',gap:16}}>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        <Kicker>EMAIL</Kicker>
        <input value={email} onChange={e=>setEmail(e.target.value)}
          style={{height:44,background:C.bg2,borderRadius:10,border:`1px solid ${C.borderStrong}`,padding:'0 14px',fontSize:13,color:C.ink0,outline:'none'}}
          placeholder="tu@email.com" type="email"/>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        <Kicker>CONTRASEÑA</Kicker>
        <input value={pass} onChange={e=>setPass(e.target.value)}
          style={{height:44,background:C.bg2,borderRadius:10,border:`1px solid ${C.borderStrong}`,padding:'0 14px',fontSize:13,color:C.ink0,outline:'none'}}
          placeholder="••••••••" type="password"/>
      </div>
      {error&&<p style={{fontSize:11,color:C.negative,textAlign:'center'}}>{error}</p>}
      <BtnPrimary onClick={login} style={{marginTop:8,opacity:loading?.6:1}}>
        {loading?<Spinner/>:'Entrar'}
      </BtnPrimary>
      <BtnGhost onClick={pop}>Volver</BtnGhost>
    </div>
  </div>;
}

function StatsScreen({params}){
  const t=params?.tipster??{display_name:'Tipster'};
  const dailyStats=useDailyStats(t.id);
  const totalProfit=dailyStats.reduce((a,d)=>a+parseFloat(d.profit_units||0),0);

  return <div style={{height:'100%',background:C.bg0,display:'flex',flexDirection:'column'}}>
    <NavHeader title="ESTADÍSTICAS"/>
    <div style={{flex:1,overflowY:'auto',padding:16}}>
      <Kicker style={{display:'block',marginBottom:4}}>YIELD · {t.display_name||'TIPSTER'}</Kicker>
      <div style={{display:'flex',alignItems:'baseline',gap:6,margin:'4px 0 2px'}}>
        <Mono style={{fontSize:52,fontWeight:500,color:parseFloat(t.yield_pct)>=0?C.accent:C.negative,letterSpacing:-1,lineHeight:'56px'}}>
          {t.yield_pct?`${parseFloat(t.yield_pct)>0?'+':''}${parseFloat(t.yield_pct).toFixed(2)}`:'—'}
        </Mono>
        {t.yield_pct&&<Mono style={{fontSize:22,color:C.ink1}}>%</Mono>}
      </div>
      <p style={{fontSize:11,color:C.ink2,marginBottom:12}}>{t.total_picks||0} picks registrados</p>
      {/* Sparkline placeholder → en producción usar recharts/d3 */}
      <div style={{height:80,background:C.bg2,borderRadius:8,border:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16,position:'relative',overflow:'hidden'}}>
        {dailyStats.length>0
          ?<svg width="100%" height="100%" viewBox="0 0 300 80" preserveAspectRatio="none">
            <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={C.accent} stopOpacity=".3"/>
              <stop offset="100%" stopColor={C.accent} stopOpacity="0"/>
            </linearGradient></defs>
            {(()=>{
              const vals=dailyStats.map(d=>parseFloat(d.profit_units||0));
              const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
              const pts=vals.map((v,i)=>`${(i/(vals.length-1))*300},${70-((v-min)/range)*60}`);
              const path=`M${pts.join(' L')}`;
              const area=`${path} L300,80 L0,80 Z`;
              return <>
                <path d={area} fill="url(#sg)"/>
                <path d={path} fill="none" stroke={C.accent} strokeWidth="1.5" strokeLinejoin="round"/>
              </>;
            })()}
          </svg>
          :<Kicker c={C.ink3}>Sin datos de historial</Kicker>}
      </div>
      {/* Stats grid */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:1,background:C.border,borderRadius:12,overflow:'hidden',border:`1px solid ${C.border}`,marginBottom:16}}>
        {[
          {l:'Picks totales',v:t.total_picks||0},
          {l:'Win rate',v:t.win_rate_pct?`${parseFloat(t.win_rate_pct).toFixed(1)}%`:'—',hi:true},
          {l:'Yield',v:t.yield_pct?`${parseFloat(t.yield_pct)>0?'+':''}${parseFloat(t.yield_pct).toFixed(2)}%`:'—',hi:true},
          {l:'Profit total',v:t.profit_units?`${parseFloat(t.profit_units)>0?'+':''}${parseFloat(t.profit_units).toFixed(1)}u`:'—'},
          {l:'Victorias',v:t.wins||0},
          {l:'Derrotas',v:t.losses||0},
        ].map(s=><div key={s.l} style={{background:C.bg2,padding:12}}>
          <Kicker>{s.l}</Kicker>
          <Mono style={{fontSize:18,fontWeight:600,color:s.hi?C.accent:C.ink0,display:'block',marginTop:4}}>{s.v}</Mono>
        </div>)}
      </div>
      {/* Daily history */}
      {dailyStats.length>0&&<>
        <Display style={{fontSize:14,display:'block',marginBottom:10}}>Historial diario</Display>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {[...dailyStats].reverse().slice(0,10).map(d=>{
            const pos=parseFloat(d.profit_units||0)>=0;
            return <Card key={d.fecha} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px'}}>
              <Display style={{fontSize:11,width:70,textTransform:'none',fontWeight:600}}>{new Date(d.fecha).toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}</Display>
              <Kicker style={{flex:1,fontSize:9}}>{d.total_picks} picks</Kicker>
              <Mono style={{fontSize:12,fontWeight:600,color:pos?C.accent:C.negative}}>{pos?'+':''}{parseFloat(d.profit_units||0).toFixed(1)}u</Mono>
              <Mono style={{fontSize:11,color:C.ink2,minWidth:50,textAlign:'right'}}>{parseFloat(d.yield_pct||0).toFixed(1)}%</Mono>
            </Card>;
          })}
        </div>
      </>}
    </div>
  </div>;
}

    </div>
    <div style={{flex:1,overflowY:'auto',padding:'0 16px 24px'}}>
      {loading&&<div style={{display:'flex',justifyContent:'center',padding:32}}><Spinner/></div>}
      {!loading&&premium.length===0&&<EmptyState icon="🏪" title="Sin canales premium" sub="No hay tipsters premium registrados aún"/>}
      {!loading&&featured&&<>
        {/* Featured */}
        <Card style={{padding:16,marginBottom:18,borderColor:'rgba(94,234,212,0.35)',background:'#0F2238'}}>
          <div style={{display:'flex',gap:6,marginBottom:12}}>
            <div style={{padding:'3px 8px',borderRadius:4,border:'1px solid rgba(251,191,36,0.4)',background:'rgba(251,191,36,0.06)'}}><Kicker c={C.gold}>★ Destacado</Kicker></div>
            <div style={{padding:'3px 8px',borderRadius:4,border:'1px solid rgba(94,234,212,0.4)'}}><Kicker c={C.accent}>PREMIUM</Kicker></div>
          </div>
          <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:12}}>
            <Avatar name={featured.display_name||'?'} size={46}/>
            <div style={{flex:1}}>
              <Display style={{fontSize:17,display:'block',lineHeight:1.1}}>{(featured.display_name||'TIPSTER').toUpperCase()}</Display>
              <Kicker>{featured.total_picks||0} picks · {featured.win_rate_pct?`${parseFloat(featured.win_rate_pct).toFixed(1)}% acc`:'—'}</Kicker>
            </div>
          </div>
          {featured.bio&&<p style={{fontSize:11,color:C.ink1,marginBottom:12,lineHeight:1.6}}>{featured.bio.slice(0,120)}{featured.bio.length>120?'…':''}</p>}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:10,borderTop:`1px solid ${C.border}`}}>
            <div>
              <Kicker>YIELD</Kicker>
              <Mono style={{fontSize:18,fontWeight:700,color:C.accent,display:'block'}}>
                {featured.yield_pct?`${parseFloat(featured.yield_pct)>0?'+':''}${parseFloat(featured.yield_pct).toFixed(1)}%`:'—'}
              </Mono>
            </div>
            <div style={{textAlign:'right'}}>
              <Kicker>DESDE</Kicker>
              <Mono style={{fontSize:18,fontWeight:700,display:'block'}}>
                {featured.price_monthly?`€${featured.price_monthly}/mes`:'Gratis'}
              </Mono>
            </div>
            <BtnPrimary onClick={()=>push('info',{tipster:featured})} style={{height:36,width:'auto',padding:'0 14px',fontSize:11}}>Ver canal</BtnPrimary>
          </div>
        </Card>
        {/* Grid */}
        <Display style={{fontSize:14,display:'block',marginBottom:10}}>CANALES <span style={{color:C.accent}}>PREMIUM</span></Display>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {premium.map((t,i)=>{
            const col=colors[i%colors.length];
            return <Card key={t.id} onClick={()=>push('info',{tipster:t})} style={{padding:11,borderColor:`${col}55`,background:`${col}11`,cursor:'pointer'}}>
              <Avatar name={t.display_name||'?'} size={32}/>
              <div style={{fontSize:12,fontWeight:600,color:C.ink0,marginTop:8,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.display_name||t.username}</div>
              <Kicker style={{fontSize:9,display:'block',marginTop:1}}>{(t.sport_focus||['—'])[0]}</Kicker>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
                <Mono style={{fontSize:12,fontWeight:700,color:col}}>
                  {t.yield_pct?`${parseFloat(t.yield_pct)>0?'+':''}${parseFloat(t.yield_pct).toFixed(1)}%`:'—'}
                </Mono>
                <Mono style={{fontSize:12,fontWeight:600}}>
                  {t.price_monthly?`€${t.price_monthly}`:'-'}
                </Mono>
              </div>
            </Card>;
          })}
        </div>
      </>}
    </div>
    <TabBar active="market" onTab={onTab}/>
  </div>;
}

// ── Router ────────────────────────────────────────────────────────────────────
function Router(){
  const {cur,reset}=useNav();
  const {session,loading}=useAuth();
  const [tab,setTab]=useState('home');

  useEffect(()=>{
    if(!loading){
      if(!session)reset('splash');
      else reset('main');
    }
  },[session,loading]);

  if(loading)return <div style={{height:'100%',background:C.bg0,display:'flex',alignItems:'center',justifyContent:'center'}}><Spinner/></div>;

  const onTab=(id)=>{setTab(id);reset('main');};

  if(!session){
    if(cur.s==='login')return <LoginScreen/>;
    return <SplashScreen/>;
  }

  if(cur.s==='chat')  return <ChatScreen  params={cur.p} onTab={onTab}/>;
  if(cur.s==='info')  return <InfoScreen  params={cur.p} onTab={onTab}/>;
  if(cur.s==='stats') return <StatsScreen params={cur.p}/>;

  if(tab==='ranking') return <RankingScreen  onTab={onTab}/>;
  if(tab==='scanner') return <ScannerScreen onTab={onTab}/>;
  if(tab==='cuenta')  return <SettingsScreen onTab={onTab}/>;
  return <HomeScreen onTab={onTab}/>;
}

function App(){
  return <AuthProvider><NavProvider><Router/></NavProvider></AuthProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
