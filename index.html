// ── Nav ───────────────────────────────────────────────────────────────────────
const NavCtx=createContext(null);
function NavProvider({children}){
  const [stack,setStack]=useState([{s:'splash',p:{}}]);
  const push =(s,p={})=>setStack(prev=>[...prev,{s,p}]);
  const pop  =()=>setStack(prev=>prev.length>1?prev.slice(0,-1):prev);
  const reset=(s,p={})=>setStack([{s,p}]);
  const cur=stack[stack.length-1];
  return <NavCtx.Provider value={{cur,push,pop,reset,canBack:stack.length>1}}>{children}</NavCtx.Provider>;
}
const useNav=()=>useContext(NavCtx);

// ── Auth ──────────────────────────────────────────────────────────────────────
const AuthCtx=createContext(null);
function AuthProvider({children}){
  const [session,setSession]=useState(null);
  const [loading,setLoading]=useState(false);
  return <AuthCtx.Provider value={{session,setSession,loading}}>{children}</AuthCtx.Provider>;
}
const useAuth=()=>useContext(AuthCtx);

// ── Hooks ─────────────────────────────────────────────────────────────────────
function useTipsters(){
  const [data,setData]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  useEffect(()=>{
    sb.from('tipsters_profiles')
      .select('id,display_name,username,bio,sport_focus,is_verified,has_premium,price_monthly,total_picks,wins,losses,voids,yield_pct,win_rate_pct,profit_units,total_staked,avatar_url,created_at')
      .order('yield_pct',{ascending:false})
      .limit(20)
      .then(({data,error})=>{
        if(error)setError(error.message);
        else setData(data||[]);
        setLoading(false);
      });
  },[]);
  return {data,loading,error};
}

function usePicks(tipsterId){
  const [data,setData]=useState([]);
  const [loading,setLoading]=useState(true);
  const fetch=useCallback(()=>{
    if(!tipsterId){setLoading(false);return;}
    sb.from('boletos')
      .select('id,casa_apuestas,cuota_total,tipo_apuesta,boleto_texto,stake,estado,tipo_acceso,profit,settled_at,fecha_procesado,nivel_confianza,confianza,analisis,imagen_url')
      .eq('tipster_id',tipsterId)
      .order('fecha_procesado',{ascending:false})
      .limit(15)
      .then(({data,error})=>{if(!error)setData(data||[]);setLoading(false);});
  },[tipsterId]);
  useEffect(()=>{fetch();},[fetch]);
  return {data,loading,refetch:fetch};
}

function useDailyStats(tipsterId){
  const [data,setData]=useState([]);
  useEffect(()=>{
    if(!tipsterId)return;
    sb.from('tipster_daily_stats')
      .select('fecha,total_picks,profit_units,yield_pct')
      .eq('tipster_id',tipsterId)
      .order('fecha',{ascending:true})
      .limit(90)
      .then(({data})=>setData(data||[]));
  },[tipsterId]);
  return data;
}

// ── Atoms ─────────────────────────────────────────────────────────────────────
function Avatar({name='?',size=40,url=null}){
  if(url) return <img src={url} style={{width:size,height:size,borderRadius:size/2,objectFit:'cover',flexShrink:0}}/>;
  const s=(name||'?').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const bg=['#7a3030','#7a5a30','#307a5a','#305a7a','#5a307a','#7a3060'][s%6];
  const ini=(name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return <div style={{width:size,height:size,borderRadius:size/2,background:bg,display:'flex',
    alignItems:'center',justifyContent:'center',flexShrink:0,fontWeight:700,
    fontSize:Math.round(size*.38),color:'#fff'}}>{ini}</div>;
}
function Kicker({c,style={},children}){return <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:1.4,textTransform:'uppercase',color:c||C.ink2,...style}}>{children}</span>;}
function Mono({children,style={}}){return <span style={{fontFamily:"'JetBrains Mono',monospace",...style}}>{children}</span>;}
function Display({children,style={}}){return <span style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:700,textTransform:'uppercase',letterSpacing:-.5,color:C.ink0,...style}}>{children}</span>;}
function Card({children,style={},onClick}){return <div onClick={onClick} style={{background:C.bg1,borderRadius:14,border:`1px solid ${C.border}`,...style}}>{children}</div>;}
function Chip({label,active,onClick}){return <button onClick={onClick} style={{flexShrink:0,padding:'6px 12px',borderRadius:999,fontFamily:"'JetBrains Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:1,background:active?C.accent:'transparent',color:active?C.accentInk:C.ink1,border:`1px solid ${active?C.accent:C.borderStrong}`,fontWeight:active?700:500,cursor:'pointer',whiteSpace:'nowrap'}}>{label}</button>;}
function BtnPrimary({children,onClick,style={}}){return <button onClick={onClick} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,height:46,padding:'0 18px',width:'100%',background:C.accent,color:C.accentInk,border:'none',borderRadius:999,fontWeight:700,fontSize:13,letterSpacing:.5,cursor:'pointer',...style}}>{children}</button>;}
function BtnGhost({children,onClick,style={}}){return <button onClick={onClick} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,height:46,padding:'0 16px',width:'100%',background:'rgba(255,255,255,0.03)',color:C.ink0,border:`1px solid ${C.borderStrong}`,borderRadius:999,fontWeight:500,fontSize:13,cursor:'pointer',...style}}>{children}</button>;}
function Pill({children}){return <div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'5px 12px',borderRadius:999,border:'1px solid rgba(94,234,212,0.4)',background:'rgba(94,234,212,0.04)'}}><div style={{width:5,height:5,borderRadius:3,background:C.accent}}/><Kicker>{children}</Kicker></div>;}
function LiveBadge(){return <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 5px',borderRadius:4,border:'1px solid rgba(248,113,113,0.4)'}}><span style={{width:4,height:4,borderRadius:2,background:C.negative,animation:'pulse 1.5s infinite'}}/><Mono style={{fontSize:8,color:C.negative,fontWeight:700,letterSpacing:1}}>LIVE</Mono></span>;}

function Spinner(){return <div style={{width:20,height:20,borderRadius:10,border:`2px solid ${C.bg3}`,borderTopColor:C.accent,animation:'spin .7s linear infinite'}}/>;}

function EmptyState({icon,title,sub}){

            <div style={{flex:1,minWidth:0}}>

              </div>
              <Kicker>{(t.sport_focus||[]).join(' · ')||'Multi-deporte'} · {t.total_picks||0} picks</Kicker>
              <div style={{display:'flex',alignItems:'center',gap:5,marginTop:5}}>
                <span style={{fontSize:11,color:C.ink1}}>
                  {t.wins||0}W · {t.losses||0}L · {t.win_rate_pct?`${parseFloat(t.win_rate_pct).toFixed(1)}% acc`:'Sin datos'}
                </span>
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <Mono style={{fontSize:15,fontWeight:600,display:'block',
                color:parseFloat(t.yield_pct)>0?C.accent:parseFloat(t.yield_pct)<0?C.negative:C.ink2}}>
                {t.yield_pct?`${parseFloat(t.yield_pct)>0?'+':''}${parseFloat(t.yield_pct).toFixed(2)}%`:'—'}
              </Mono>
              <Kicker style={{display:'block',marginTop:3}}>yield</Kicker>
              <Mono style={{fontSize:10,color:C.ink2,display:'block',marginTop:2}}>
                {t.profit_units?`${parseFloat(t.profit_units)>0?'+':''}${parseFloat(t.profit_units).toFixed(1)}u`:''}
              </Mono>
            </div>
          </Card>)}
        </div>
      </div>
    </div>
    <TabBar active="home" onTab={onTab}/>
  </div>;
}

// ── CHAT (picks reales del tipster) ───────────────────────────────────────────
function ChatScreen({params,onTab}){
  const {push}=useNav();
  const t=params?.tipster??{display_name:'GalloVIP'};
  const {data:picks,loading,refetch}=usePicks(t.id);
  const [msg,setMsg]=useState('');
  const [sending,setSending]=useState(false);
  const [liquidando,setLiquidando]=useState(null); // pick id abierto

  // Cargar usuarios para el selector

  // ¿Puede gestionar este canal?
  const {session}=useAuth();
const esTipster=session?.user?.is_admin||session?.user?.role==='tipster';
const esApostador=session?.user?.role==='apostador';
const puedeGestionar=esTipster;

  // Liquidar pick
async function liquidar(pickId, resultado){
  setLiquidando(null);
  const {data:boleto}=await sb.from('boletos').select('stake,cuota_total,tipster_id,tipo_acceso,fecha_procesado').eq('id',pickId).single();
  const stake=parseFloat(boleto.stake)||0;
  const cuota=parseFloat(boleto.cuota_total)||0;
  let profit=0;
  if(resultado==='ganado') profit=Math.round((stake*cuota-stake)*100)/100;
  else if(resultado==='perdido') profit=-stake;

  // Actualizar boleto
  await sb.from('boletos').update({estado:resultado,profit,settled_at:new Date().toISOString()}).eq('id',pickId);

  // Actualizar stats globales via RPC
const {data:rpcData,error:rpcError}=await sb.rpc('actualizar_stats_tipster',{
    p_tipster_id:boleto.tipster_id,
    p_resultado:resultado,
    p_stake:stake,
    p_profit:profit,
  });
  console.log('RPC result:', rpcData, rpcError);
  // Upsert stats diarias
  const fecha=new Date().toISOString().split('T')[0];
  const cat=boleto.tipo_acceso==='premium'?'premium':'free';
  const {data:existing}=await sb.from('tipster_daily_stats')
    .select('*').eq('tipster_id',boleto.tipster_id)
    .eq('fecha',fecha).eq('categoria',cat).maybeSingle();
  if(existing){
    await sb.from('tipster_daily_stats').update({
      picks_ganados:  existing.picks_ganados +(resultado==='ganado' ?1:0),
      picks_perdidos: existing.picks_perdidos+(resultado==='perdido'?1:0),
      picks_nulos:    existing.picks_nulos   +(resultado==='nulo'   ?1:0),
      total_picks:    existing.total_picks+1,
      profit_units:   parseFloat(existing.profit_units)+profit,
      total_staked:   parseFloat(existing.total_staked)+stake,
      yield_pct:      parseFloat(existing.total_staked)+stake>0?Math.round(((parseFloat(existing.profit_units)+profit)/(parseFloat(existing.total_staked)+stake))*10000)/100:0,
    }).eq('id',existing.id);
  } else {
    await sb.from('tipster_daily_stats').insert({
      tipster_id:boleto.tipster_id,fecha,categoria:cat,
      total_picks:1,
      picks_ganados:  resultado==='ganado' ?1:0,
      picks_perdidos: resultado==='perdido'?1:0,
      picks_nulos:    resultado==='nulo'   ?1:0,
      profit_units:profit,total_staked:stake,
      yield_pct:stake>0?Math.round((profit/stake)*10000)/100:0,
    });
  }
  refetch();
}

  // Enviar mensaje de texto
  async function enviarMensaje(){
    if(!msg.trim()||!puedeGestionar)return;
    setSending(true);
    // Buscar canal del tipster
    const {data:canal}=await sb.from('canales').select('id').eq('tipster_id',t.id).limit(1).single();
    if(canal){
      await sb.from('mensajes').insert({
        canal_id:canal.id,
        tipster_id:t.id,
        tipo:'texto',
        contenido:msg.trim(),
        created_at:new Date().toISOString(),
      });
    }
    setMsg('');
    setSending(false);
  }

  const estadoConfig={
    ganado:{color:C.positive,icon:'🏆',label:'Ganado'},
    perdido:{color:C.negative,icon:'❌',label:'Perdido'},
    pendiente:{color:C.gold,icon:'⏳',label:'Pendiente'},
    nulo:{color:C.ink2,icon:'➖',label:'Nulo'},
    en_curso:{color:C.accent,icon:'🔴',label:'En curso'},
  };

  // ── Selector de identidad ─────────────────────────────────────────────────

  // ── Chat principal ────────────────────────────────────────────────────────
  return <div style={{height:'100%',background:C.bg0,display:'flex',flexDirection:'column'}}>
    <NavHeader title={t.display_name||t.username||'Canal'}
      right={<button onClick={()=>push('info',{tipster:t})} style={{height:34,padding:'0 12px',borderRadius:8,background:'rgba(94,234,212,0.1)',border:'1px solid rgba(94,234,212,0.4)',color:C.accent,fontSize:11,fontWeight:700,cursor:'pointer',letterSpacing:.5}}>INFO →</button>}/>
    <div style={{flex:1,overflowY:'auto',padding:'14px 14px 0'}}>
      {/* Channel info strip */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,padding:'10px 12px',background:C.bg2,borderRadius:10,border:`1px solid ${C.border}`}}>
        <Avatar name={t.display_name||'?'} size={32} url={t.avatar_url}/>
        <div style={{flex:1}}>
          <div style={{fontSize:12,fontWeight:600,color:C.ink0}}>{t.display_name||t.username}</div>
          <Kicker>{t.total_picks||0} picks · {t.win_rate_pct?`${parseFloat(t.win_rate_pct).toFixed(1)}% acc`:'—'}</Kicker>
        </div>
        {t.is_verified&&<div style={{padding:'3px 8px',borderRadius:4,background:'rgba(94,234,212,0.1)',border:'1px solid rgba(94,234,212,0.3)'}}>
          <Kicker c={C.accent}>Verificado</Kicker>
        </div>}
        {puedeGestionar&&<a href="./ocr-scanner.html" style={{padding:'3px 10px',borderRadius:4,background:'rgba(94,234,212,0.1)',border:'1px solid rgba(94,234,212,0.3)',textDecoration:'none',display:'flex',alignItems:'center',gap:4}}>
          <Kicker c={C.accent}>📸 PICK</Kicker>
        </a>}
      </div>

      {/* Picks */}
      {loading&&<div style={{display:'flex',justifyContent:'center',padding:32}}><Spinner/></div>}
      {!loading&&picks.length===0&&<EmptyState icon="📭" title="Sin picks" sub="Este tipster aún no tiene picks registrados"/>}
      {picks.map(p=>{
        const estado=p.estado||'pendiente';
        const cfg=estadoConfig[estado]||estadoConfig.pendiente;
        const ec=cfg.color;
        const isLive=p.tipo_apuesta==='live';
        const isPremium=p.tipo_acceso==='premium';
        const profit=p.profit!=null?parseFloat(p.profit):null;
        const beneficio=profit!=null?profit:(p.stake&&p.cuota_total?Math.round((parseFloat(p.stake)*parseFloat(p.cuota_total)-parseFloat(p.stake))*100)/100:null);
        const isPendiente=estado==='pendiente'||estado==='en_curso';

        return <div key={p.id} style={{marginBottom:16,animation:'fadeIn .25s ease'}}>
          {/* Header row con badge desplegable */}
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>

                overflow:'hidden',zIndex:10,minWidth:120,
              }}>
                {[
                  {r:'ganado',icon:'🏆',label:'Ganado',c:C.positive},
                  {r:'perdido',icon:'❌',label:'Perdido',c:C.negative},
                  {r:'nulo',icon:'➖',label:'Nulo',c:C.ink2},
                ].map(o=><button key={o.r} onClick={()=>liquidar(p.id,o.r)} style={{
                  display:'flex',alignItems:'center',gap:8,width:'100%',

                }}>
                  <span style={{fontSize:12}}>{o.icon}</span>

              </div>}
            </div>}
          </div>

          {/* Card */}
          <div style={{background:C.bg1,borderRadius:14,overflow:'hidden',border:`1px solid ${estado==='ganado'?'rgba(52,211,153,0.3)':estado==='perdido'?'rgba(248,113,113,0.25)':C.border}`}}>

            <div style={{padding:14}}>
              {/* Meta badges */}

                  <Kicker c={isLive?C.negative:C.ink0}>{isLive?'Live':'Pre-Partido'}</Kicker>

                {p.casa_apuestas&&<div style={{padding:'3px 8px',borderRadius:4,border:'1px solid rgba(94,234,212,0.4)',background:'rgba(94,234,212,0.08)',display:'flex',alignItems:'center',gap:4}}>

                </div>}
                <div style={{padding:'3px 8px',borderRadius:4,border:'1px solid rgba(255,255,255,0.2)',background:'rgba(255,255,255,0.05)',display:'flex',alignItems:'center',gap:4}}>
                  <span style={{fontSize:9}}>🕒</span>
                  <Kicker c={C.ink0}>{p.fecha_procesado?new Date(p.fecha_procesado).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}</Kicker>
                </div>
                <div style={{padding:'3px 8px',borderRadius:4,border:`1px solid ${isPremium?'rgba(168,85,247,0.4)':'rgba(52,211,153,0.4)'}`,background:isPremium?'rgba(168,85,247,0.08)':'rgba(52,211,153,0.08)',display:'flex',alignItems:'center',gap:4}}>

          <span style={{fontSize:12,color:C.ink2}}>Solo lectura — identifícate para escribir</span>
        </div>
      }
    </div>
  </div>;

function StatsScreen({params}){
  const t=params?.tipster??{display_name:'Tipster'};
  const dailyStats=useDailyStats(t.id);
  const totalProfit=dailyStats.reduce((a,d)=>a+parseFloat(d.profit_units||0),0);

  return <div style={{height:'100%',background:C.bg0,display:'flex',flexDirection:'column'}}>
    <NavHeader title="ESTADÍSTICAS"/>
    <div style={{flex:1,overflowY:'auto',padding:16}}>
      <Kicker style={{display:'block',marginBottom:4}}>YIELD · {t.display_name||'TIPSTER'}</Kicker>
      <div style={{display:'flex',alignItems:'baseline',gap:6,margin:'4px 0 2px'}}>
        <Mono style={{fontSize:52,fontWeight:500,color:parseFloat(t.yield_pct)>=0?C.accent:C.negative,letterSpacing:-1,lineHeight:'56px'}}>
          {t.yield_pct?`${parseFloat(t.yield_pct)>0?'+':''}${parseFloat(t.yield_pct).toFixed(2)}`:'—'}
        </Mono>
        {t.yield_pct&&<Mono style={{fontSize:22,color:C.ink1}}>%</Mono>}
      </div>
      <p style={{fontSize:11,color:C.ink2,marginBottom:12}}>{t.total_picks||0} picks registrados</p>
      {/* Sparkline placeholder → en producción usar recharts/d3 */}
      <div style={{height:80,background:C.bg2,borderRadius:8,border:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16,position:'relative',overflow:'hidden'}}>
        {dailyStats.length>0
          ?<svg width="100%" height="100%" viewBox="0 0 300 80" preserveAspectRatio="none">
            <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={C.accent} stopOpacity=".3"/>
              <stop offset="100%" stopColor={C.accent} stopOpacity="0"/>
            </linearGradient></defs>
            {(()=>{
              const vals=dailyStats.map(d=>parseFloat(d.profit_units||0));
              const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
              const pts=vals.map((v,i)=>`${vals.length>1?(i/(vals.length-1))*300:150},${70-((v-min)/range)*60}`);
              const path=`M${pts.join(' L')}`;
              const area=`${path} L300,80 L0,80 Z`;
              return <>
                <path d={area} fill="url(#sg)"/>
                <path d={path} fill="none" stroke={C.accent} strokeWidth="1.5" strokeLinejoin="round"/>
              </>;
            })()}
          </svg>
          :<Kicker c={C.ink3}>Sin datos de historial</Kicker>}
      </div>
      {/* Stats grid */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:1,background:C.border,borderRadius:12,overflow:'hidden',border:`1px solid ${C.border}`,marginBottom:16}}>
        {[
          {l:'Picks totales',v:t.total_picks||0},
          {l:'Win rate',v:t.win_rate_pct?`${parseFloat(t.win_rate_pct).toFixed(1)}%`:'—',hi:true},
          {l:'Yield',v:t.yield_pct?`${parseFloat(t.yield_pct)>0?'+':''}${parseFloat(t.yield_pct).toFixed(2)}%`:'—',hi:true},
          {l:'Profit total',v:t.profit_units?`${parseFloat(t.profit_units)>0?'+':''}${parseFloat(t.profit_units).toFixed(1)}u`:'—'},
          {l:'Victorias',v:t.wins||0},
          {l:'Derrotas',v:t.losses||0},
        ].map(s=><div key={s.l} style={{background:C.bg2,padding:12}}>
          <Kicker>{s.l}</Kicker>
          <Mono style={{fontSize:18,fontWeight:600,color:s.hi?C.accent:C.ink0,display:'block',marginTop:4}}>{s.v}</Mono>
        </div>)}
      </div>
      {/* Daily history */}
      {dailyStats.length>0&&<>
        <Display style={{fontSize:14,display:'block',marginBottom:10}}>Historial diario</Display>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {[...dailyStats].reverse().slice(0,10).map(d=>{
            const pos=parseFloat(d.profit_units||0)>=0;
            return <Card key={d.fecha} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px'}}>
              <Display style={{fontSize:11,width:70,textTransform:'none',fontWeight:600}}>{new Date(d.fecha).toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}</Display>
              <Kicker style={{flex:1,fontSize:9}}>{d.total_picks} picks</Kicker>
              <Mono style={{fontSize:12,fontWeight:600,color:pos?C.accent:C.negative}}>{pos?'+':''}{parseFloat(d.profit_units||0).toFixed(1)}u</Mono>
              <Mono style={{fontSize:11,color:C.ink2,minWidth:50,textAlign:'right'}}>{parseFloat(d.yield_pct||0).toFixed(1)}%</Mono>
            </Card>;
          })}
        </div>
      </>}
    </div>
  </div>;
}

// ── RANKING ───────────────────────────────────────────────────────────────────
function RankingScreen({onTab}){
  const {push}=useNav();
  const {data:tipsters,loading}=useTipsters();
  const [period,setPeriod]=useState('30d');

  const sorted=[...tipsters].sort((a,b)=>parseFloat(b.yield_pct||0)-parseFloat(a.yield_pct||0));
  const podium=sorted.length>=3?[sorted[1],sorted[0],sorted[2]]:sorted;
  const rest=sorted.slice(3);

  return <div style={{height:'100%',background:C.bg0,display:'flex',flexDirection:'column'}}>
    <div style={{padding:'52px 16px 12px',flexShrink:0}}>
      <Kicker c={C.accent} style={{display:'block',marginBottom:3}}>TSAI LEADERBOARD</Kicker>
      <Display style={{fontSize:24,display:'block'}}>RANKING</Display>
    </div>
    <div style={{padding:'0 16px 12px',flexShrink:0}}>
      <div style={{display:'flex',padding:3,background:C.bg2,borderRadius:10,border:`1px solid ${C.border}`}}>
        {['7d','30d','90d','Anual'].map(p=><button key={p} onClick={()=>setPeriod(p)} style={{flex:1,padding:'8px 0',background:period===p?C.accent:'transparent',borderRadius:7,border:'none',cursor:'pointer'}}>
          <Kicker c={period===p?C.accentInk:C.ink2} style={{fontWeight:period===p?700:500}}>{p}</Kicker>
        </button>)}
      </div>
    </div>
    <div style={{flex:1,overflowY:'auto',padding:'0 16px 24px'}}>
      {loading&&<div style={{display:'flex',justifyContent:'center',padding:32}}><Spinner/></div>}
      {!loading&&sorted.length===0&&<EmptyState icon="🏆" title="Sin datos de ranking" sub="No hay tipsters registrados"/>}
      {!loading&&sorted.length>=3&&<>
        {/* Podium */}
        <div style={{display:'flex',alignItems:'flex-end',gap:8,marginBottom:22,marginTop:20}}>
          {podium.map((t,i)=>{
            const isFirst=i===1;
            const ac=isFirst?C.gold:i===0?C.accent:C.accent2;
            const rank=isFirst?1:i===0?2:3;
            return <div key={t.id} onClick={()=>push('info',{tipster:t})} style={{flex:isFirst?1.12:1,marginTop:isFirst?0:16,textAlign:'center',cursor:'pointer'}}>
              <div style={{width:isFirst?28:24,height:isFirst?28:24,borderRadius:999,background:C.bg0,border:`1.5px solid ${ac}`,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 4px'}}>
                <Mono style={{fontSize:isFirst?13:11,fontWeight:700,color:ac}}>{rank}</Mono>
              </div>
              <div style={{padding:'12px 6px',border:`1px solid ${ac}55`,borderRadius:12,background:isFirst?'rgba(251,191,36,0.05)':C.bg1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                {isFirst&&<span style={{fontSize:14}}>👑</span>}
                <Avatar name={t.display_name||'?'} size={isFirst?48:36} url={t.avatar_url}/>
                <span style={{fontSize:isFirst?12:10,fontWeight:600,color:C.ink0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'90%'}}>{t.display_name||t.username}</span>
                <Kicker style={{fontSize:8}}>{(t.sport_focus||['—'])[0]}</Kicker>
                <Mono style={{fontSize:isFirst?15:12,fontWeight:700,color:ac}}>
                  {t.yield_pct?`${parseFloat(t.yield_pct)>0?'+':''}${parseFloat(t.yield_pct).toFixed(1)}%`:'—'}
                </Mono>
              </div>
            </div>;
          })}
        </div>
        {/* List */}
        {rest.length>0&&<>
          <Kicker style={{display:'block',marginBottom:8}}>4 — {sorted.length} · CLASIFICACIÓN</Kicker>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {rest.map((t,i)=><Card key={t.id} onClick={()=>push('info',{tipster:t})} style={{display:'flex',alignItems:'center',gap:8,padding:10,cursor:'pointer'}}>
              <Mono style={{fontSize:11,color:C.ink2,fontWeight:600,width:18,textAlign:'center'}}>{i+4}</Mono>
              <Avatar name={t.display_name||'?'} size={30} url={t.avatar_url}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,color:C.ink0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.display_name||t.username}</div>
                <Kicker style={{fontSize:8}}>{(t.sport_focus||[]).join(' · ')||'Multi'} · {t.total_picks||0} picks</Kicker>
              </div>
              <Mono style={{fontSize:12,fontWeight:600,color:parseFloat(t.yield_pct)>=0?C.accent:C.negative}}>
                {t.yield_pct?`${parseFloat(t.yield_pct)>0?'+':''}${parseFloat(t.yield_pct).toFixed(1)}%`:'—'}
              </Mono>
            </Card>)}
          </div>
        </>}
      </>}
    </div>
    <TabBar active="ranking" onTab={onTab}/>
  </div>;
}

// ── Router ────────────────────────────────────────────────────────────────────
function Router(){
  const {cur,reset}=useNav();
  const {session,loading}=useAuth();
  const [tab,setTab]=useState('home');

useEffect(()=>{
  if(!session)reset('splash');
  else reset('main');
},[session]);

  if(loading)return <div style={{height:'100%',background:C.bg0,display:'flex',alignItems:'center',justifyContent:'center'}}><Spinner/></div>;

  const onTab=(id)=>{setTab(id);reset('main');};

  if(!session){
    if(cur.s==='login')return <LoginScreen/>;
    return <SplashScreen/>;
  }

  if(cur.s==='chat')  return <ChatScreen  params={cur.p} onTab={onTab}/>;
  if(cur.s==='info')  return <InfoScreen  params={cur.p} onTab={onTab}/>;
  if(cur.s==='stats') return <StatsScreen params={cur.p}/>;

  if(tab==='ranking') return <RankingScreen  onTab={onTab}/>;
  if(tab==='market')  return <MarketplaceScreen onTab={onTab}/>;
  if(tab==='cuenta')  return <SettingsScreen onTab={onTab}/>;
  return <HomeScreen onTab={onTab}/>;
}

function App(){
  return <AuthProvider><NavProvider><Router/></NavProvider></AuthProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
